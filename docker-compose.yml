services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - mongo
      - redis
    networks:
      - codesense-network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node src/workers/reviewWorker.js
    env_file:
      - ./server/.env
    depends_on:
      - mongo
      - redis
    networks:
      - codesense-network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://codesense-ai.duckdns.org
    ports:
      - "8000:80"
    depends_on:
      - server
    networks:
      - codesense-network

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - codesense-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - codesense-network

volumes:
  mongo-data:
  redis-data:

networks:
  codesense-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
