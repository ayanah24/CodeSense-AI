name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/CodeSense-AI
            echo "Pulling latest main"
            git pull --ff-only origin main
            echo "Deploying commit $(git rev-parse --short HEAD)"
            echo "Building Docker images"
            docker compose --parallel 1 build
            echo "Starting containers"
            docker compose up -d --force-recreate
            echo "Checking frontend response"
            for attempt in $(seq 1 12); do
              if curl --fail --silent http://localhost:8000/ > /dev/null; then
                echo "Frontend responded successfully"
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "Frontend did not respond after 60 seconds"
                docker compose ps
                docker compose logs --tail=100 client
                exit 1
              fi
              echo "Frontend not ready yet (attempt $attempt/12); retrying in 5 seconds"
              sleep 5
            done
            docker image prune -f
            docker compose ps
